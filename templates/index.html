<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Resume Analyzer</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>AI Resume Analyzer</h1>

        <p>Upload your resume to analyze it.</p>

        <div class="upload-box">

            <form action="/analyze"
                  method="POST"
                  enctype="multipart/form-data">

                <input
                    type="file"
                    name="resume"
                    accept=".pdf"
                    required
                >

                <br><br>

                <button type="submit">
                    Analyze Resume
                </button>

            </form>

        </div>

    </div>

</body>

</html>
